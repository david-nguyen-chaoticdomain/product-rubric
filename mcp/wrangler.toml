# Cloudflare Worker for the hosted ProductRubric MCP server.
# Deploys the fetch entry in src/worker.ts and serves the shipped library
# (embedded at build time by scripts/gen-rubrics.mjs) at
# https://mcp.productrubric.com
name = "product-rubric-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[[routes]]
pattern = "mcp.productrubric.com"
custom_domain = true

# The submit host is declared here too, not only in the dashboard:
# a deploy built from this file must describe the whole Worker,
# or dashboard-added routes and variables can be left behind by a
# later deploy (the Phase 3 launch hit exactly that: the MCP host's
# deployment could not see the GitHub sign-in values, so the
# submit_rubric tool stayed off while the submit host worked).
[[routes]]
pattern = "submit.productrubric.com"
custom_domain = true

# The OAuth app's client ID is a public value (it appears in every
# sign-in URL), so it lives in the repo as a plain variable. Its
# secret, GITHUB_CLIENT_SECRET, stays a dashboard secret and must
# exist on the production deployment for either host to sign anyone
# in; the code fails closed without it.
[vars]
GITHUB_CLIENT_ID = "Ov23liWoigkTpvA2MqVQ"

# Rate limiting for the hosted server (see src/worker.ts): 100 requests
# per minute per client IP. Counters are per Cloudflare location and
# eventually consistent, so this is an abuse speed bump, not exact
# accounting. Over the limit, the Worker answers 429.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }
# Limit history: set to 100 requests per minute per IP on Oct 20, 2026.

# Preview deployments (Workers Builds runs wrangler preview for pull
# request branches) need their own rate limit namespace: preview
# counters stay separate from production, with the same 100 per minute.
[[previews.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"

[previews.ratelimits.simple]
limit = 100
period = 60
